<svg xmlns="http://www.w3.org/2000/svg" width="860" height="280" viewBox="0 0 860 280">
  <defs>
    <linearGradient id="cardGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="artGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a3a2a"/>
      <stop offset="100%" stop-color="#052e16"/>
    </linearGradient>
    <linearGradient id="prog2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#6ee7b7"/>
    </linearGradient>
    <linearGradient id="glowBar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#34d399" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Label -->
  <text x="430" y="16" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#374151">DESIGN 2  —  ARTWORK CARD  (episode art hero, glassmorphism controls below)</text>

  <!-- Outer card -->
  <rect x="10" y="26" width="840" height="244" rx="24" fill="url(#cardGrad)" stroke="#1f2937" stroke-width="1.5"/>

  <!-- Left: large artwork panel -->
  <rect x="10" y="26" width="260" height="244" rx="24" fill="url(#artGrad)"/>
  <!-- Art inner glow -->
  <rect x="10" y="26" width="260" height="244" rx="24" fill="url(#glowBar)"/>
  <!-- Mic icon placeholder -->
  <circle cx="140" cy="148" r="38" fill="#0a2318" stroke="#14532d" stroke-width="1.5"/>
  <text x="140" y="158" text-anchor="middle" font-family="sans-serif" font-size="32" fill="#34d399">♪</text>
  <!-- Season/ep badge -->
  <rect x="24" y="40" width="90" height="22" rx="11" fill="#052e16" stroke="#14532d" stroke-width="1"/>
  <text x="69" y="55" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="bold" fill="#34d399" letter-spacing="1">S1  EP 1</text>

  <!-- Right: info + controls -->
  <!-- Title block -->
  <text x="292" y="62" font-family="sans-serif" font-size="11" fill="#34d399" letter-spacing="2">NOW PLAYING</text>
  <text x="292" y="90" font-family="sans-serif" font-size="22" font-weight="bold" fill="#ffffff">The Map That Drew Itself</text>
  <text x="292" y="113" font-family="sans-serif" font-size="13" fill="#4b5563">The Cartographer's Dream</text>

  <!-- Waveform visualiser strip -->
  <g>
    <rect x="292" y="128" width="2" height="6"  rx="1" fill="#34d399" opacity="0.4"/>
    <rect x="297" y="124" width="2" height="10" rx="1" fill="#34d399" opacity="0.5"/>
    <rect x="302" y="120" width="2" height="14" rx="1" fill="#34d399" opacity="0.7"/>
    <rect x="307" y="125" width="2" height="9"  rx="1" fill="#34d399" opacity="0.9"/>
    <rect x="312" y="118" width="2" height="16" rx="1" fill="#34d399"/>
    <rect x="317" y="122" width="2" height="12" rx="1" fill="#34d399" opacity="0.9"/>
    <rect x="322" y="119" width="2" height="15" rx="1" fill="#34d399" opacity="0.8"/>
    <rect x="327" y="126" width="2" height="8"  rx="1" fill="#34d399" opacity="0.6"/>
    <rect x="332" y="121" width="2" height="13" rx="1" fill="#34d399" opacity="0.5"/>
    <!-- played = grey after -->
    <rect x="337" y="128" width="2" height="6"  rx="1" fill="#374151" opacity="0.6"/>
    <rect x="342" y="124" width="2" height="10" rx="1" fill="#374151" opacity="0.5"/>
    <rect x="347" y="120" width="2" height="14" rx="1" fill="#374151" opacity="0.4"/>
    <rect x="352" y="125" width="2" height="9"  rx="1" fill="#374151" opacity="0.4"/>
    <rect x="357" y="117" width="2" height="17" rx="1" fill="#374151" opacity="0.4"/>
    <rect x="362" y="123" width="2" height="11" rx="1" fill="#374151" opacity="0.4"/>
    <rect x="367" y="120" width="2" height="14" rx="1" fill="#374151" opacity="0.4"/>
    <rect x="372" y="127" width="2" height="7"  rx="1" fill="#374151" opacity="0.4"/>
    <rect x="377" y="122" width="2" height="12" rx="1" fill="#374151" opacity="0.4"/>
    <rect x="382" y="128" width="2" height="6"  rx="1" fill="#374151" opacity="0.4"/>
    <rect x="387" y="124" width="2" height="10" rx="1" fill="#374151" opacity="0.4"/>
    <rect x="392" y="119" width="2" height="15" rx="1" fill="#374151" opacity="0.4"/>
  </g>
  <!-- Scrubber head on waveform -->
  <line x1="336" y1="116" x2="336" y2="148" stroke="#34d399" stroke-width="2" opacity="0.9"/>
  <circle cx="336" cy="148" r="5" fill="#34d399"/>

  <!-- Time -->
  <text x="292" y="162" font-family="sans-serif" font-size="11" fill="#6b7280">2:04</text>
  <text x="408" y="162" font-family="sans-serif" font-size="11" fill="#6b7280">6:24</text>

  <!-- Glass control bar -->
  <rect x="292" y="178" width="544" height="74" rx="18" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.07" stroke-width="1"/>

  <!-- Skip back -->
  <text x="330" y="221" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#9ca3af">⏮ 15s</text>

  <!-- Pause button -->
  <circle cx="420" cy="215" r="26" fill="#34d399"/>
  <rect x="412" y="204" width="6" height="22" rx="3" fill="#052e16"/>
  <rect x="422" y="204" width="6" height="22" rx="3" fill="#052e16"/>

  <!-- Skip forward -->
  <text x="510" y="221" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#9ca3af">15s ⏭</text>

  <!-- Volume icon -->
  <text x="590" y="221" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#6b7280">🔊</text>
  <rect x="610" y="212" width="80" height="4" rx="2" fill="#27272a"/>
  <rect x="610" y="212" width="52" height="4" rx="2" fill="#34d399"/>
  <circle cx="662" cy="214" r="5" fill="#34d399"/>

  <!-- Speed pill -->
  <rect x="714" y="207" width="48" height="24" rx="12" fill="#052e16" stroke="#14532d" stroke-width="1"/>
  <text x="738" y="223" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#34d399">1.0×</text>

  <!-- Chapter label -->
  <text x="292" y="263" font-family="sans-serif" font-size="11" fill="#4b5563">Chapter  ·  "The Cartographer's Study"</text>
  <text x="780" y="263" font-family="sans-serif" font-size="11" fill="#34d399">Next →</text>
</svg>
