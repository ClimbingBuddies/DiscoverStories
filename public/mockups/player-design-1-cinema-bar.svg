<svg xmlns="http://www.w3.org/2000/svg" width="860" height="160" viewBox="0 0 860 160">
  <defs>
    <linearGradient id="bg1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0a0a0a"/>
      <stop offset="100%" stop-color="#111111"/>
    </linearGradient>
    <linearGradient id="progress1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
  </defs>

  <!-- Card background -->
  <rect width="860" height="160" rx="20" fill="url(#bg1)" stroke="#1f2937" stroke-width="1.5"/>

  <!-- Episode art thumbnail -->
  <rect x="18" y="18" width="124" height="124" rx="12" fill="#1c1c1c" stroke="#2d2d2d" stroke-width="1"/>
  <text x="80" y="85" text-anchor="middle" fill="#3f3f3f" font-size="28">🎙</text>

  <!-- Title area -->
  <text x="162" y="48" font-family="sans-serif" font-size="11" fill="#34d399" letter-spacing="2">EPISODE 1  ·  SEASON 1</text>
  <text x="162" y="72" font-family="sans-serif" font-size="17" font-weight="bold" fill="#ffffff">The Map That Drew Itself</text>
  <text x="162" y="92" font-family="sans-serif" font-size="12" fill="#6b7280">The Cartographer's Dream  ·  6 min 24 sec</text>

  <!-- Waveform bars (decorative) -->
  <g opacity="0.35">
    <rect x="162" y="106" width="3" height="8"  rx="1.5" fill="#34d399"/>
    <rect x="168" y="102" width="3" height="12" rx="1.5" fill="#34d399"/>
    <rect x="174" y="98"  width="3" height="16" rx="1.5" fill="#34d399"/>
    <rect x="180" y="104" width="3" height="10" rx="1.5" fill="#34d399"/>
    <rect x="186" y="100" width="3" height="14" rx="1.5" fill="#34d399"/>
    <rect x="192" y="106" width="3" height="8"  rx="1.5" fill="#34d399"/>
    <rect x="198" y="96"  width="3" height="18" rx="1.5" fill="#34d399"/>
    <rect x="204" y="103" width="3" height="11" rx="1.5" fill="#34d399"/>
    <rect x="210" y="99"  width="3" height="15" rx="1.5" fill="#34d399"/>
    <rect x="216" y="105" width="3" height="9"  rx="1.5" fill="#34d399"/>
    <rect x="222" y="101" width="3" height="13" rx="1.5" fill="#34d399"/>
    <rect x="228" y="97"  width="3" height="17" rx="1.5" fill="#34d399"/>
    <rect x="234" y="104" width="3" height="10" rx="1.5" fill="#34d399"/>
    <rect x="240" y="102" width="3" height="12" rx="1.5" fill="#34d399"/>
    <rect x="246" y="106" width="3" height="8"  rx="1.5" fill="#34d399"/>
  </g>

  <!-- Progress track -->
  <rect x="162" y="132" width="530" height="4" rx="2" fill="#27272a"/>
  <rect x="162" y="132" width="132" height="4" rx="2" fill="url(#progress1)"/>
  <!-- Scrubber dot -->
  <circle cx="294" cy="134" r="6" fill="#34d399"/>

  <!-- Time labels -->
  <text x="162" y="150" font-family="sans-serif" font-size="11" fill="#6b7280">2:04</text>
  <text x="692" y="150" font-family="sans-serif" font-size="11" fill="#6b7280">6:24</text>

  <!-- Controls -->
  <!-- Rewind 15 -->
  <circle cx="740" cy="80" r="22" fill="#1c1c1c" stroke="#27272a" stroke-width="1.5"/>
  <text x="740" y="85" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#9ca3af">↩15</text>

  <!-- Play/Pause -->
  <circle cx="800" cy="80" r="30" fill="#34d399"/>
  <polygon points="793,66 793,94 822,80" fill="#052e16"/>

  <!-- Forward 15 -->
  <circle cx="850" cy="80" r="22" fill="#1c1c1c" stroke="#27272a" stroke-width="1.5"/>
  <text x="850" y="85" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#9ca3af">15↪</text>

  <!-- Speed badge -->
  <rect x="700" y="118" width="44" height="22" rx="11" fill="#1c1c1c" stroke="#27272a" stroke-width="1.5"/>
  <text x="722" y="133" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#34d399">1.0x</text>

  <!-- Label -->
  <text x="430" y="18" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#374151">DESIGN 1  —  CINEMA BAR  (dark, full-width, episode art + waveform)</text>
</svg>
