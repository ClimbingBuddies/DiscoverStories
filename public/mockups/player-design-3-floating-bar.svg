<svg xmlns="http://www.w3.org/2000/svg" width="860" height="110" viewBox="0 0 860 110">
  <defs>
    <linearGradient id="pillBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#0f0f0f"/>
    </linearGradient>
    <linearGradient id="prog3" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#a7f3d0"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Label -->
  <text x="430" y="12" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#374151">DESIGN 3  —  FLOATING STICKY BAR  (pinned bottom, minimal, always visible)</text>

  <!-- Pill / floating bar -->
  <rect x="40" y="22" width="780" height="76" rx="38" fill="url(#pillBg)" stroke="#27272a" stroke-width="1.5"/>
  <!-- subtle top highlight -->
  <rect x="40" y="22" width="780" height="4" rx="2" fill="#ffffff" fill-opacity="0.03"/>

  <!-- Thumbnail -->
  <rect x="56" y="30" width="60" height="60" rx="14" fill="#1c1c1c" stroke="#2d2d2d" stroke-width="1"/>
  <text x="86" y="67" text-anchor="middle" font-family="sans-serif" font-size="22" fill="#34d399">♪</text>

  <!-- Title + episode info -->
  <text x="130" y="51" font-family="sans-serif" font-size="13" font-weight="bold" fill="#ffffff">The Map That Drew Itself</text>
  <text x="130" y="69" font-family="sans-serif" font-size="11" fill="#6b7280">Ep 1  ·  2:04 / 6:24</text>

  <!-- Progress bar (thin, full width under title) -->
  <rect x="130" y="78" width="320" height="3" rx="1.5" fill="#27272a"/>
  <rect x="130" y="78" width="100" height="3" rx="1.5" fill="url(#prog3)"/>
  <circle cx="230" cy="79.5" r="5" fill="#34d399" filter="url(#glow)"/>

  <!-- Spacer -->

  <!-- Rewind -->
  <g transform="translate(490,30)">
    <circle cx="25" cy="30" r="22" fill="#1c1c1c" stroke="#27272a" stroke-width="1"/>
    <text x="25" y="35" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#9ca3af">↩15</text>
  </g>

  <!-- Play/Pause central button -->
  <circle cx="588" cy="60" r="30" fill="#34d399"/>
  <!-- Play triangle -->
  <polygon points="580,46 580,74 608,60" fill="#052e16"/>

  <!-- Forward -->
  <g transform="translate(620,30)">
    <circle cx="25" cy="30" r="22" fill="#1c1c1c" stroke="#27272a" stroke-width="1"/>
    <text x="25" y="35" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#9ca3af">15↪</text>
  </g>

  <!-- Speed -->
  <rect x="686" y="48" width="44" height="24" rx="12" fill="#27272a"/>
  <text x="708" y="64" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#34d399">1.0×</text>

  <!-- Volume -->
  <text x="745" y="65" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#4b5563">🔊</text>

  <!-- Close X -->
  <circle cx="800" cy="60" r="14" fill="#27272a"/>
  <text x="800" y="65" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#6b7280">✕</text>
</svg>
