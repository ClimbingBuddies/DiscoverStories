<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Rømer's measurement of light using Io</title>
  <desc id="desc">Jupiter and its moon Io are shown at right. Earth is shown at two points in its orbit, one nearer Jupiter and one farther away. The extra distance causes Io's eclipses to be observed later when Earth is farther from Jupiter.</desc>
  <defs>
    <radialGradient id="sun" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#fff7ae"/><stop offset="0.6" stop-color="#facc15"/><stop offset="1" stop-color="#f59e0b"/></radialGradient>
    <radialGradient id="earth" cx="35%" cy="30%" r="70%"><stop offset="0" stop-color="#93c5fd"/><stop offset="1" stop-color="#1d4ed8"/></radialGradient>
    <radialGradient id="jupiter" cx="35%" cy="30%" r="70%"><stop offset="0" stop-color="#fed7aa"/><stop offset="1" stop-color="#b45309"/></radialGradient>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#38bdf8"/></marker>
    <marker id="arrowAmber" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/></marker>
  </defs>
  <rect width="1200" height="720" fill="#050816"/>
  <g fill="#e2e8f0" opacity="0.75">
    <circle cx="100" cy="90" r="2"/><circle cx="210" cy="160" r="2"/><circle cx="340" cy="75" r="3"/><circle cx="500" cy="120" r="2"/><circle cx="760" cy="85" r="2"/><circle cx="1040" cy="130" r="3"/><circle cx="1110" cy="300" r="2"/><circle cx="80" cy="590" r="3"/><circle cx="430" cy="630" r="2"/><circle cx="980" cy="620" r="2"/>
  </g>
  <ellipse cx="430" cy="360" rx="300" ry="210" fill="none" stroke="#334155" stroke-width="5" stroke-dasharray="14 12"/>
  <circle cx="430" cy="360" r="62" fill="url(#sun)"/>
  <text x="390" y="450" fill="#fde68a" font-family="Arial, sans-serif" font-size="30" font-weight="700">Sun</text>
  <circle cx="160" cy="270" r="32" fill="url(#earth)"/>
  <text x="90" y="225" fill="#bfdbfe" font-family="Arial, sans-serif" font-size="28" font-weight="700">Earth nearer</text>
  <text x="118" y="255" fill="#bfdbfe" font-family="Arial, sans-serif" font-size="24">Jupiter</text>
  <circle cx="610" cy="530" r="32" fill="url(#earth)"/>
  <text x="560" y="590" fill="#bfdbfe" font-family="Arial, sans-serif" font-size="28" font-weight="700">Earth farther</text>
  <circle cx="1010" cy="350" r="78" fill="url(#jupiter)"/>
  <ellipse cx="1010" cy="350" rx="120" ry="36" fill="none" stroke="#fdba74" stroke-width="5" opacity="0.7"/>
  <circle cx="1115" cy="350" r="16" fill="#fef3c7"/>
  <text x="955" y="465" fill="#fed7aa" font-family="Arial, sans-serif" font-size="32" font-weight="700">Jupiter</text>
  <text x="1095" y="325" fill="#fef3c7" font-family="Arial, sans-serif" font-size="26" font-weight="700">Io</text>
  <line x1="978" y1="330" x2="195" y2="275" stroke="#38bdf8" stroke-width="7" marker-end="url(#arrowBlue)"/>
  <line x1="970" y1="380" x2="647" y2="520" stroke="#f59e0b" stroke-width="7" marker-end="url(#arrowAmber)"/>
  <text x="500" y="245" fill="#7dd3fc" font-family="Arial, sans-serif" font-size="28" font-weight="700">Shorter light path</text>
  <text x="720" y="500" fill="#fdba74" font-family="Arial, sans-serif" font-size="28" font-weight="700">Longer light path</text>
  <rect x="130" y="610" width="940" height="82" rx="18" fill="#0f172a" stroke="#475569" stroke-width="3"/>
  <text x="170" y="648" fill="#e2e8f0" font-family="Arial, sans-serif" font-size="27">Io's eclipse schedule acts like a clock. As Earth moves farther away, the eclipses appear late.</text>
  <text x="170" y="680" fill="#e2e8f0" font-family="Arial, sans-serif" font-size="27">The accumulating delay reveals that light needs time to cross the extra distance.</text>
</svg>