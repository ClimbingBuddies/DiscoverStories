<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">Galileo's lantern experiment</title>
  <desc id="desc">Two observers stand on separate hills one kilometre apart. Observer A uncovers a lantern, light travels to observer B, and observer B uncovers a second lantern in response. The total measured delay combines light travel time with two human reaction times.</desc>
  <defs>
    <linearGradient id="sky" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#08111f"/><stop offset="1" stop-color="#172554"/></linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#fde047"/></marker>
  </defs>
  <rect width="1200" height="650" fill="url(#sky)"/>
  <circle cx="1030" cy="105" r="52" fill="#f8fafc" opacity="0.9"/>
  <path d="M0 520 Q190 340 390 500 T790 500 T1200 480 V650 H0 Z" fill="#173f2f"/>
  <path d="M0 565 Q200 405 400 545 T800 545 T1200 525" fill="none" stroke="#2f6f55" stroke-width="8"/>
  <g fill="#e2e8f0" font-family="Arial, sans-serif">
    <text x="120" y="315" font-size="34" font-weight="700">Observer A</text>
    <text x="910" y="315" font-size="34" font-weight="700">Observer B</text>
  </g>
  <g stroke="#cbd5e1" stroke-width="12" stroke-linecap="round">
    <circle cx="210" cy="390" r="26" fill="#cbd5e1"/><path d="M210 420 L210 500 M210 445 L165 470 M210 445 L250 465 M210 500 L175 545 M210 500 L245 545"/>
    <circle cx="980" cy="390" r="26" fill="#cbd5e1"/><path d="M980 420 L980 500 M980 445 L940 470 M980 445 L1025 470 M980 500 L945 545 M980 500 L1015 545"/>
  </g>
  <g>
    <rect x="250" y="435" width="52" height="62" rx="8" fill="#f59e0b" stroke="#fef3c7" stroke-width="4"/>
    <rect x="900" y="435" width="52" height="62" rx="8" fill="#f59e0b" stroke="#fef3c7" stroke-width="4"/>
    <circle cx="276" cy="422" r="28" fill="#fde047" opacity="0.9"/>
    <circle cx="926" cy="422" r="28" fill="#fde047" opacity="0.9"/>
  </g>
  <line x1="305" y1="420" x2="892" y2="420" stroke="#fde047" stroke-width="10" marker-end="url(#arrow)"/>
  <text x="470" y="385" fill="#fef9c3" font-family="Arial, sans-serif" font-size="34" font-weight="700">Light signal</text>
  <line x1="300" y1="575" x2="900" y2="575" stroke="#94a3b8" stroke-width="4"/>
  <line x1="300" y1="560" x2="300" y2="590" stroke="#94a3b8" stroke-width="4"/>
  <line x1="900" y1="560" x2="900" y2="590" stroke="#94a3b8" stroke-width="4"/>
  <text x="505" y="625" fill="#e2e8f0" font-family="Arial, sans-serif" font-size="32" font-weight="700">1 km baseline</text>
  <rect x="360" y="90" width="480" height="150" rx="18" fill="#0f172a" stroke="#38bdf8" stroke-width="3"/>
  <text x="400" y="140" fill="#7dd3fc" font-family="Arial, sans-serif" font-size="30" font-weight="700">Why the experiment could not succeed</text>
  <text x="400" y="185" fill="#e2e8f0" font-family="Arial, sans-serif" font-size="28">Light crosses 1 km in about 3.34 microseconds.</text>
  <text x="400" y="220" fill="#e2e8f0" font-family="Arial, sans-serif" font-size="28">Human reaction time is roughly 0.2 seconds.</text>
</svg>