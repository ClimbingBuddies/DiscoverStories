name: Audio Platform Delete Story

on:
  workflow_dispatch:
    inputs:
      action:
        description: Preview first; execute requires the preview operation ID
        required: true
        type: choice
        options:
          - preview
          - execute
      story_slug:
        description: Exact lowercase story slug
        required: true
        type: string
      operation_id:
        description: Required for execute; copy from the preview result
        required: false
        type: string
      confirmation:
        description: Required for execute; DELETE followed by the exact slug
        required: false
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  delete-story:
    runs-on: ubuntu-latest
    steps:
      - name: Validate request
        shell: bash
        env:
          ACTION: ${{ inputs.action }}
          STORY_SLUG: ${{ inputs.story_slug }}
          OPERATION_ID: ${{ inputs.operation_id }}
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          [[ "$STORY_SLUG" =~ ^[a-z0-9]+(-[a-z0-9]+)*$ ]]
          if [[ "$ACTION" == "execute" ]]; then
            [[ -n "$OPERATION_ID" ]]
            [[ "$CONFIRMATION" == "DELETE $STORY_SLUG" ]]
          fi

      - name: Request GitHub OIDC token
        id: oidc
        uses: actions/github-script@v7
        with:
          script: |
            const token = await core.getIDToken('supabase-story-artwork')
            core.setSecret(token)
            core.setOutput('token', token)

      - name: Preview or execute exact story deletion
        shell: bash
        env:
          ACTION: ${{ inputs.action }}
          STORY_SLUG: ${{ inputs.story_slug }}
          OPERATION_ID: ${{ inputs.operation_id }}
          CONFIRMATION: ${{ inputs.confirmation }}
          OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
          BRIDGE_URL: https://qsyapcprhhmlsgdzclwq.supabase.co/functions/v1/github-story-artwork-bridge
        run: |
          set -euo pipefail
          if [[ "$ACTION" == "preview" ]]; then
            payload=$(jq -cn --arg slug "$STORY_SLUG" \
              '{action:"delete-preview",storySlug:$slug}')
          else
            payload=$(jq -cn --arg slug "$STORY_SLUG" \
              --arg operationId "$OPERATION_ID" \
              --arg confirmation "$CONFIRMATION" \
              '{action:"delete-execute",storySlug:$slug,operationId:$operationId,confirmation:$confirmation}')
          fi
          http_status=$(curl --silent --show-error \
            --output "$RUNNER_TEMP/delete-result.json" \
            --write-out '%{http_code}' \
            --request POST "$BRIDGE_URL" \
            --header "Authorization: Bearer $OIDC_TOKEN" \
            --header "Content-Type: application/json" \
            --data "$payload")
          jq . "$RUNNER_TEMP/delete-result.json"
          [[ "$http_status" -ge 200 && "$http_status" -lt 300 ]]

      - name: Upload deletion report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: story-deletion-${{ inputs.action }}-${{ inputs.story_slug }}
          path: ${{ runner.temp }}/delete-result.json
          if-no-files-found: error
