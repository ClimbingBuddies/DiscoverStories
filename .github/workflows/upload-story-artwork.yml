name: Upload queued story artwork

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "production-queue/**/manifest.json"
      - "production-queue/**/image.b64"
  workflow_dispatch:
    inputs:
      queue_path:
        description: Queue folder or batch folder beneath production-queue
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  upload:
    runs-on: ubuntu-latest
    env:
      SUPABASE_FUNCTION_URL: https://qsyapcprhhmlsgdzclwq.supabase.co/functions/v1/github-story-artwork-bridge
    steps:
      - name: Check out queued artwork
        uses: actions/checkout@v4

      - name: Resolve queued manifests
        id: queue
        shell: bash
        run: |
          set -euo pipefail
          output="$RUNNER_TEMP/queued-manifests.txt"
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            target="production-queue/${{ inputs.queue_path }}"
            if [[ -f "$target/manifest.json" ]]; then
              printf '%s\n' "$target/manifest.json" > "$output"
            else
              find "$target" -name manifest.json -type f | sort > "$output"
            fi
          else
            find production-queue -name manifest.json -type f | sort > "$output"
          fi
          test -s "$output"
          while IFS= read -r manifest; do
            test -f "$(dirname "$manifest")/image.b64"
          done < "$output"
          echo "manifest_list=$output" >> "$GITHUB_OUTPUT"
          echo "count=$(wc -l < "$output" | tr -d ' ')" >> "$GITHUB_OUTPUT"

      - name: Request short-lived GitHub identity token
        id: oidc
        shell: bash
        run: |
          set -euo pipefail
          response=$(curl -sS --fail-with-body \
            -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=supabase-story-artwork")
          token=$(jq -r '.value' <<< "$response")
          test -n "$token"
          echo "::add-mask::$token"
          echo "token=$token" >> "$GITHUB_OUTPUT"

      - name: Upload and link artwork batch
        shell: bash
        run: |
          set -euo pipefail
          results="$RUNNER_TEMP/upload-results.jsonl"
          : > "$results"

          while IFS= read -r manifest; do
            folder=$(dirname "$manifest")
            image_file="$RUNNER_TEMP/$(basename "$folder").jpg"
            base64 --decode "$folder/image.b64" > "$image_file"
            test -s "$image_file"

            story_slug=$(jq -r '.storySlug' "$manifest")
            asset_role=$(jq -r '.assetRole' "$manifest")
            stage=$(jq -r '.stage // "concept"' "$manifest")
            workflow_status=$(jq -r '.workflowStatus // "draft"' "$manifest")
            version_number=$(jq -r '.versionNumber // 1' "$manifest")
            season_number=$(jq -r '.seasonNumber // empty' "$manifest")
            episode_number=$(jq -r '.episodeNumber // empty' "$manifest")
            generation_notes=$(jq -r '.generationNotes // "ChatGPT generated draft concept transferred through the Story Pipeline."' "$manifest")

            args=(
              -sS --fail-with-body
              -X POST "$SUPABASE_FUNCTION_URL"
              -H "Authorization: Bearer ${{ steps.oidc.outputs.token }}"
              -F "action=upload"
              -F "storySlug=$story_slug"
              -F "assetRole=$asset_role"
              -F "stage=$stage"
              -F "workflowStatus=$workflow_status"
              -F "versionNumber=$version_number"
              -F "generationNotes=$generation_notes"
              -F "file=@$image_file;type=image/jpeg"
            )

            if [[ -n "$season_number" ]]; then args+=( -F "seasonNumber=$season_number" ); fi
            if [[ -n "$episode_number" ]]; then args+=( -F "episodeNumber=$episode_number" ); fi

            result=$(curl "${args[@]}")
            jq -e '.uploaded == true and (.storagePath | length > 0)' <<< "$result"
            jq -c . <<< "$result" >> "$results"
          done < "${{ steps.queue.outputs.manifest_list }}"

          test "$(wc -l < "$results" | tr -d ' ')" = "${{ steps.queue.outputs.count }}"
          jq -s '{status:"complete", uploaded:length, results:.}' "$results" > "$RUNNER_TEMP/upload-result.json"

      - name: Upload result manifest
        uses: actions/upload-artifact@v4
        with:
          name: story-artwork-upload-result
          path: ${{ runner.temp }}/upload-result.json
          retention-days: 7
