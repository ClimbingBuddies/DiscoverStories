name: Upload queued story media

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "production-queue/**/batch.json"
      - "production-queue/**/manifest.json"
      - "production-queue/**/image.b64"
  workflow_dispatch:
    inputs:
      queue_path:
        description: Queue batch file or folder beneath production-queue
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  upload:
    runs-on: ubuntu-latest
    env:
      SUPABASE_FUNCTION_URL: https://qsyapcprhhmlsgdzclwq.supabase.co/functions/v1/github-story-artwork-bridge
    steps:
      - name: Check out queued artwork
        uses: actions/checkout@v4

      - name: Prepare queue
        id: queue
        shell: bash
        run: |
          set -euo pipefail
          queue="$RUNNER_TEMP/artwork-queue.jsonl"
          : > "$queue"

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            target="production-queue/${{ inputs.queue_path }}"
          else
            target="production-queue"
          fi

          if [[ -f "$target" && "$target" == *.json ]]; then
            batch_files=("$target")
          else
            mapfile -t batch_files < <(find "$target" -name batch.json -type f | sort)
          fi

          if [[ ${#batch_files[@]} -gt 0 ]]; then
            for batch in "${batch_files[@]}"; do
              jq -c '.items[]' "$batch" >> "$queue"
            done
          else
            while IFS= read -r manifest; do
              folder=$(dirname "$manifest")
              image_base64=$(tr -d '\n\r' < "$folder/image.b64")
              jq -c --arg imageBase64 "$image_base64" '. + {imageBase64:$imageBase64}' "$manifest" >> "$queue"
            done < <(find "$target" -name manifest.json -type f | sort)
          fi

          test -s "$queue"
          jq -e 'has("storySlug") and has("assetRole") and has("imageBase64")' "$queue" >/dev/null
          jq -e '(.assetRole | IN("cover", "banner", "episode", "reader", "canon"))' "$queue" >/dev/null
          if jq -e '(.assetRole == "reader" or .assetRole == "episode") and ((.seasonNumber|type) != "number" or (.episodeNumber|type) != "number")' "$queue" >/dev/null; then
            echo "Reader and episode media require numeric seasonNumber and episodeNumber." >&2
            exit 1
          fi
          echo "queue=$queue" >> "$GITHUB_OUTPUT"
          echo "count=$(wc -l < "$queue" | tr -d ' ')" >> "$GITHUB_OUTPUT"

      - name: Request short-lived GitHub identity token
        id: oidc
        shell: bash
        run: |
          set -euo pipefail
          response=$(curl -sS --fail-with-body \
            -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=supabase-story-artwork")
          token=$(jq -r '.value' <<< "$response")
          test -n "$token"
          echo "::add-mask::$token"
          echo "token=$token" >> "$GITHUB_OUTPUT"

      - name: Install image conversion tools
        run: sudo apt-get update && sudo apt-get install -y imagemagick

      - name: Upload and link media batch
        shell: bash
        run: |
          set -uo pipefail
          results="$RUNNER_TEMP/upload-results.jsonl"
          failures="$RUNNER_TEMP/upload-failures.jsonl"
          : > "$results"
          : > "$failures"
          item_number=0
          declare -A episode_hashes=()
          if command -v magick >/dev/null 2>&1; then
            image_convert=(magick)
          else
            image_convert=(convert)
          fi

          while IFS= read -r item; do
            item_number=$((item_number + 1))
            source_file="$RUNNER_TEMP/story-artwork-${item_number}.source"
            image_file="$RUNNER_TEMP/story-artwork-${item_number}.jpg"
            if ! jq -r '.imageBase64' <<< "$item" | base64 --decode > "$source_file" || [[ ! -s "$source_file" ]]; then
              jq -cn --argjson item "$item_number" --arg error "Base64 decode failed" '{item:$item,error:$error}' >> "$failures"
              continue
            fi
            if ! "${image_convert[@]}" "$source_file" -auto-orient -strip -resize '1280x1280>' -quality 82 "$image_file" || [[ "$(identify -quiet -format '%m' "$image_file")" != "JPEG" ]]; then
              jq -cn --argjson item "$item_number" --arg error "JPEG conversion or validation failed" '{item:$item,error:$error}' >> "$failures"
              continue
            fi
            # Reject exact duplicate episode artwork before any Storage upload.
            # Cover and banner may share a visual direction, but two episode assets
            # in the same batch must not contain identical converted JPEG bytes.
            asset_role=$(jq -r '.assetRole' <<< "$item")
            if [[ "$asset_role" == episode* ]]; then
              image_hash=$(sha256sum "$image_file" | awk '{print $1}')
              duplicate_item="${episode_hashes[$image_hash]-}"
              if [[ -n "$duplicate_item" ]]; then
                jq -cn --argjson item "$item_number" --arg assetRole "$asset_role" \
                  --arg duplicateOf "$duplicate_item" --arg hash "$image_hash" \
                  --arg error "Duplicate episode artwork bytes; rejected before upload" \
                  '{item:$item,assetRole:$assetRole,duplicateOf:$duplicateOf,sha256:$hash,error:$error}' >> "$failures"
                continue
              fi
              episode_hashes["$image_hash"]="$asset_role"
            fi

            story_slug=$(jq -r '.storySlug' <<< "$item")
            asset_role=$(jq -r '.assetRole' <<< "$item")
            stage=$(jq -r '.stage // "concept"' <<< "$item")
            workflow_status=$(jq -r '.workflowStatus // "draft"' <<< "$item")
            version_number=$(jq -r '.versionNumber // 1' <<< "$item")
            season_number=$(jq -r '.seasonNumber // empty' <<< "$item")
            episode_number=$(jq -r '.episodeNumber // empty' <<< "$item")
            generation_notes=$(jq -r '.generationNotes // "ChatGPT generated draft concept transferred through the Story Pipeline."' <<< "$item")
            file_name=$(jq -r '.fileName // empty' <<< "$item")

            args=(
              -sS --fail-with-body
              -X POST "$SUPABASE_FUNCTION_URL"
              -H "Authorization: Bearer ${{ steps.oidc.outputs.token }}"
              -F "action=upload"
              -F "storySlug=$story_slug"
              -F "assetRole=$asset_role"
              -F "stage=$stage"
              -F "workflowStatus=$workflow_status"
              -F "versionNumber=$version_number"
              -F "generationNotes=$generation_notes"
              -F "file=@$image_file;type=image/jpeg"
            )

            if [[ -n "$season_number" ]]; then args+=( -F "seasonNumber=$season_number" ); fi
            if [[ -n "$episode_number" ]]; then args+=( -F "episodeNumber=$episode_number" ); fi

            uploaded=false
            result=""
            for attempt in 1 2 3; do
              if result=$(curl "${args[@]}") && jq -e '.uploaded == true and (.storagePath | length > 0)' <<< "$result" >/dev/null; then
                uploaded=true
                break
              fi
              sleep $((attempt * 2))
            done
            if [[ "$uploaded" == true ]]; then
              jq -c . <<< "$result" >> "$results"
            else
              jq -cn --argjson item "$item_number" --arg storySlug "$story_slug" --arg assetRole "$asset_role" --arg error "Upload failed after three attempts" '{item:$item,storySlug:$storySlug,assetRole:$assetRole,error:$error}' >> "$failures"
            fi
          done < "${{ steps.queue.outputs.queue }}"

          jq -s --slurpfile failures "$failures" '{status:(if ($failures[0] | length) == 0 then "complete" else "partial" end), uploaded:length, failed:($failures[0] | length), results:., failures:$failures[0]}' "$results" > "$RUNNER_TEMP/upload-result.json"
          if [[ -s "$failures" ]]; then
            echo "::error::One or more artwork items failed. Rerun only the failed queue items from the result manifest."
            exit 1
          fi

      - name: Upload result manifest
        uses: actions/upload-artifact@v4
        with:
          name: story-artwork-upload-result
          path: ${{ runner.temp }}/upload-result.json
          retention-days: 7
