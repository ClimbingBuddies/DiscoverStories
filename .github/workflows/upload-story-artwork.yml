name: Upload queued story media

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "production-queue/**/manifest.json"
      - "production-queue/**/*.jpg"

permissions:
  contents: read
  id-token: write

jobs:
  upload:
    runs-on: ubuntu-latest
    env:
      SUPABASE_FUNCTION_URL: https://qsyapcprhhmlsgdzclwq.supabase.co/functions/v1/github-story-artwork-bridge
    steps:
      - name: Check out queued artwork
        uses: actions/checkout@v4

      - name: Request short-lived GitHub identity token
        id: oidc
        shell: bash
        run: |
          set -euo pipefail
          response=$(curl -sS --fail-with-body \
            -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=supabase-story-artwork")
          token=$(jq -r '.value' <<< "$response")
          test -n "$token"
          echo "::add-mask::$token"
          echo "token=$token" >> "$GITHUB_OUTPUT"

      - name: Upload native binary Canon image
        shell: bash
        run: |
          set -euo pipefail
          folder="production-queue/life-inside-the-dyson/helios-gate-native-test"
          manifest="$folder/manifest.json"
          image="$folder/image.jpg"
          test -s "$image"
          file "$image" | grep -qi 'JPEG image data'
          story_slug=$(jq -r '.storySlug' "$manifest")
          asset_role=$(jq -r '.assetRole' "$manifest")
          stage=$(jq -r '.stage // "concept"' "$manifest")
          workflow_status=$(jq -r '.workflowStatus // "draft"' "$manifest")
          version_number=$(jq -r '.versionNumber // 1' "$manifest")
          generation_notes=$(jq -r '.generationNotes' "$manifest")
          canon_project_slug=$(jq -r '.canonProjectSlug' "$manifest")
          canon_object_slug=$(jq -r '.canonObjectSlug' "$manifest")
          canon_asset_title=$(jq -r '.canonAssetTitle' "$manifest")
          canon_asset_role=$(jq -r '.canonAssetRole // "reference"' "$manifest")
          canon_asset_description=$(jq -r '.canonAssetDescription // empty' "$manifest")
          canon_sort_order=$(jq -r '.canonSortOrder // 0' "$manifest")
          canon_is_primary=$(jq -r '.canonIsPrimaryReference // false' "$manifest")
          result=$(curl -sS --fail-with-body \
            -X POST "$SUPABASE_FUNCTION_URL" \
            -H "Authorization: Bearer ${{ steps.oidc.outputs.token }}" \
            -F "action=upload" \
            -F "storySlug=$story_slug" \
            -F "assetRole=$asset_role" \
            -F "stage=$stage" \
            -F "workflowStatus=$workflow_status" \
            -F "versionNumber=$version_number" \
            -F "generationNotes=$generation_notes" \
            -F "canonProjectSlug=$canon_project_slug" \
            -F "canonObjectSlug=$canon_object_slug" \
            -F "canonAssetTitle=$canon_asset_title" \
            -F "canonAssetRole=$canon_asset_role" \
            -F "canonAssetDescription=$canon_asset_description" \
            -F "canonSortOrder=$canon_sort_order" \
            -F "canonIsPrimaryReference=$canon_is_primary" \
            -F "file=@$image;type=image/jpeg")
          echo "$result" | jq .
          jq -e '.uploaded == true and (.storagePath | length > 0)' <<< "$result"
