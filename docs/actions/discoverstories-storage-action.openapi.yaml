openapi: 3.1.0
info:
  title: DiscoverStories Storage Action
  description: Controlled image storage operations for a private DiscoverStories GPT.
  version: 1.0.1
servers:
  - url: https://qsyapcprhhmlsgdzclwq.supabase.co/functions/v1/discoverstories-storage-action
security:
  - ActionKey: []
paths:
  /storage-list:
    post:
      operationId: storage_list
      summary: List story images in private or public storage.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ListRequest'
      responses:
        '200':
          description: Matching Storage objects.
  /storage-inspect:
    post:
      operationId: storage_inspect
      summary: Inspect one story image without changing it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InspectRequest'
      responses:
        '200':
          description: Object existence and metadata.
  /storage-upload:
    post:
      operationId: storage_upload
      summary: Upload one conversation image into private story storage.
      description: Uploads exactly one user-supplied or ChatGPT-generated JPG, PNG or WEBP image. The destination is always private storage.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UploadRequest'
      responses:
        '200':
          description: Upload result and private Storage path.
  /storage-copy:
    post:
      operationId: storage_copy
      summary: Copy one image while preserving the source.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CopyRequest'
      responses:
        '200':
          description: Copy result.
  /storage-publish-batch:
    post:
      operationId: storage_publish_batch
      summary: Copy approved private images to public storage as a controlled batch.
      description: Always call with dryRun true first. Call with dryRun false only after the user approves the exact manifest.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PublishBatchRequest'
      responses:
        '200':
          description: Dry-run manifest or completed publishing result.
components:
  securitySchemes:
    ActionKey:
      type: http
      scheme: bearer
  schemas:
    StoryRequest:
      type: object
      required: [storySlug]
      properties:
        storySlug:
          type: string
          pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$'
          description: Existing story slug.
    ListRequest:
      allOf:
        - $ref: '#/components/schemas/StoryRequest'
        - type: object
          properties:
            visibility:
              type: string
              enum: [private, public]
              default: private
            prefix:
              type: string
              description: Optional path relative to the story root.
    InspectRequest:
      allOf:
        - $ref: '#/components/schemas/StoryRequest'
        - type: object
          required: [path]
          properties:
            visibility:
              type: string
              enum: [private, public]
              default: private
            path:
              type: string
              description: Exact path relative to the story root.
    UploadRequest:
      allOf:
        - $ref: '#/components/schemas/StoryRequest'
        - type: object
          required: [path, openaiFileIdRefs]
          properties:
            path:
              type: string
              description: Lowercase private destination path relative to the story root, ending in .jpg, .jpeg, .png or .webp.
            openaiFileIdRefs:
              type: array
              minItems: 1
              maxItems: 1
              items:
                type: string
              description: Exactly one image from the conversation, either uploaded by the user or generated by ChatGPT.
    CopyRequest:
      allOf:
        - $ref: '#/components/schemas/StoryRequest'
        - type: object
          required: [sourcePath, destinationPath]
          properties:
            sourceVisibility:
              type: string
              enum: [private, public]
              default: private
            sourcePath:
              type: string
              description: Source path relative to the story root.
            destinationVisibility:
              type: string
              enum: [private, public]
              default: private
            destinationPath:
              type: string
              description: Destination path relative to the story root. Existing files are never overwritten.
    PublishEntry:
      type: object
      additionalProperties: false
      required: [sourcePath, destinationPath]
      properties:
        sourcePath:
          type: string
          description: Private path relative to the story UUID root.
        destinationPath:
          type: string
          description: Public path relative to the story slug root.
    PublishBatchRequest:
      allOf:
        - $ref: '#/components/schemas/StoryRequest'
        - type: object
          required: [entries, dryRun]
          properties:
            entries:
              type: array
              minItems: 1
              maxItems: 50
              items:
                $ref: '#/components/schemas/PublishEntry'
            dryRun:
              type: boolean
              description: Must be true for preview. Set false only after the user approves the returned manifest.
